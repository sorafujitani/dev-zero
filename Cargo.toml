[package]
name = "dev-zero"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A CLI and TUI for dev-null.sh"
license = "MIT"
repository = "https://github.com/sorafujitani/dev-zero"

[[bin]]
name = "dz"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tui-textarea = "0.7"

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
